  <script>
    const DATA = JSON.parse(document.getElementById("report-data").textContent);
    const m = DATA.meta;
    document.getElementById("sub").textContent =
      m.source + " · " + m.pilot_count + "/" + m.restaurant_count + " Restaurants pilotfähig · " +
      m.train_rows + " Trainingzeilen";

    const base = {
      margin: { t: 20, r: 20, b: 50, l: 55 },
      font: { size: 12 },
      showlegend: true,
    };

    const months = Object.keys(DATA.monthly_cr);
    Plotly.newPlot("chartVolume", [
      { x: months, y: months.map(k => DATA.monthly_cr[k]), name: "Company-Requests", type: "scatter", mode: "lines" },
      { x: months, y: months.map(k => DATA.monthly_orders[k]), name: "Einzelbestellungen", type: "scatter", mode: "lines" },
    ], { ...base, xaxis: { title: "Monat", tickangle: -40 }, yaxis: { title: "Anzahl", rangemode: "tozero" }, legend: { orientation: "h" } }, {responsive: true, displaylogo: false});

    const pilots = DATA.restaurants.filter(r => r.pilot);
    const others = DATA.restaurants.filter(r => !r.pilot && r.active_days > 0);
    const unused = DATA.restaurants.filter(r => r.active_days === 0);
    const mk = (list, name) => ({
      x: list.map(r => r.active_days),
      y: list.map(r => r.span_days),
      text: list.map(r => r.name),
      customdata: list.map(r => [r.orders, r.coverage]),
      name, mode: "markers", type: "scatter",
      marker: { size: list.map(r => Math.max(8, Math.sqrt(r.orders))), opacity: 0.8 },
      hovertemplate: "<b>%{text}</b><br>aktive Tage: %{x}<br>Spanne: %{y}<br>Bestellungen: %{customdata[0]}<br>Abdeckung: %{customdata[1]:.1f}%<extra></extra>",
    });
    const maxA = Math.max(...DATA.restaurants.map(r => r.active_days), 30);
    const maxS = Math.max(...DATA.restaurants.map(r => r.span_days), 60);
    Plotly.newPlot("chartPilot", [
      mk(pilots, "pilotfähig"),
      mk(others, "nicht genug Historie"),
      mk(unused, "keine Bestellungen"),
      { x: [20, 20], y: [0, maxS], mode: "lines", name: "min 20 aktive Tage", line: { dash: "dash", width: 1, color: "#888" }, hoverinfo: "skip" },
      { x: [0, maxA], y: [56, 56], mode: "lines", name: "min 56 Tage Spanne", line: { dash: "dot", width: 1, color: "#888" }, hoverinfo: "skip" },
    ], { ...base, xaxis: { title: "Aktive Bestelltage", rangemode: "tozero" }, yaxis: { title: "Kalenderspanne (Tage)", rangemode: "tozero" }, legend: { orientation: "h" } }, {responsive: true, displaylogo: false});

    const select = document.getElementById("restSelect");
    const names = Object.keys(DATA.calendar).sort((a, b) =>
      DATA.calendar[b].reduce((s, p) => s + p.orders, 0) - DATA.calendar[a].reduce((s, p) => s + p.orders, 0)
    );
    names.forEach(n => {
      const o = document.createElement("option");
      o.value = n; o.textContent = n; select.appendChild(o);
    });
    function drawCal(name) {
      const pts = DATA.calendar[name] || [];
      Plotly.newPlot("chartCalendar", [{
        x: pts.map(p => p.date),
        y: pts.map(p => p.orders),
        type: "bar",
        marker: { color: pts.map(p => p.orders === 0 ? "#ccc" : "#333") },
        hovertemplate: "%{x}: %{y}<extra></extra>",
      }], { ...base, showlegend: false, xaxis: { title: "Werktag", type: "date" }, yaxis: { title: "Einzelbestellungen", rangemode: "tozero" } }, {responsive: true, displaylogo: false});
    }
    select.onchange = () => drawCal(select.value);
    if (names.length) { select.value = names[0]; drawCal(names[0]); }

    const ba = DATA.before_after;
    Plotly.newPlot("chartBeforeAfter", [
      { y: ba.map(r => r.metric), x: ba.map(r => r.before), name: "vorher", type: "bar", orientation: "h",
        customdata: ba.map(r => r.note), hovertemplate: "%{y}: %{x} (%{customdata})<extra>vorher</extra>" },
      { y: ba.map(r => r.metric), x: ba.map(r => r.after), name: "nachher", type: "bar", orientation: "h",
        customdata: ba.map(r => r.note), hovertemplate: "%{y}: %{x} (%{customdata})<extra>nachher</extra>" },
    ], { ...base, barmode: "group", xaxis: { title: "Anzahl", rangemode: "tozero" }, yaxis: { autorange: "reversed" }, margin: { t: 20, r: 20, b: 40, l: 140 }, legend: { orientation: "h" } }, {responsive: true, displaylogo: false});
  </script>
